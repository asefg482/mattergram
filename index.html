    <meta name="apple-mobile-web-app-title" content="Mattergram" />
    <meta name="theme-color" content="#17212b" />
    <title>Mattergram — Telegram for Mattermost</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('mattergram_theme_id') || 'classic-dark';
          var a = localStorage.getItem('mattergram_animation_preset') || 'smooth';
          var m = (t === 'classic-light') ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-anim', a);
          document.documentElement.classList.add(m);
          if (m === 'light') document.documentElement.classList.remove('dark');
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#e4ecf2] dark:bg-[#0e1621] text-[#111827] dark:text-[#f5f5f5] select-none font-sans antialiased overflow-hidden">
    <div id="app" class="h-full w-full flex overflow-hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
